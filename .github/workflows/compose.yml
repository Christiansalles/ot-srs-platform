name: Docker Compose

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Construir e iniciar serviços
        run: docker compose up --build -d
      - name: Verificar banco, API, frontend e Adminer
        run: |
          docker compose exec -T db pg_isready -U ot -d ot_srs

          wait_for_http() {
            local url="$1"
            for attempt in {1..30}; do
              if curl --silent --show-error --fail --max-time 2 "$url" -o /dev/null; then
                echo "Ready: $url"
                return 0
              fi
              echo "Waiting for $url (attempt $attempt/30)"
              sleep 1
            done

            echo "Timed out waiting for $url"
            docker compose ps
            docker compose logs
            return 1
          }

          wait_for_http http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/api/health | grep -q '"status":"ok"'
          wait_for_http http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8080/ | grep -q 'id="root"'
          wait_for_http http://localhost:8081/
          curl --fail --silent --show-error http://localhost:8081/ | grep -qi 'adminer'
      - name: Verificar integração do front com a API
        run: |
          # A API sobe depois de migrate e seed, então a carga já deve estar no banco.
          curl --fail --silent --show-error http://localhost:3000/api/indicadores/destaques | grep -q '"Número de leitos"'
          curl --fail --silent --show-error 'http://localhost:3000/api/indicadores?setor=1' | grep -q '"medicoes"'

          # CORS: o navegador abre o front em :8080 e chama a API em :3000.
          curl --fail --silent --show-error -o /dev/null -D - \
            -H 'Origin: http://localhost:8080' http://localhost:3000/api/indicadores \
            | grep -qi '^access-control-allow-origin:'

          # O build do front aponta para a API publicada pelo Compose.
          script=$(curl --fail --silent --show-error http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl --fail --silent --show-error "http://localhost:8080$script" -o "$RUNNER_TEMP/front.js"
          grep -q 'http://localhost:3000' "$RUNNER_TEMP/front.js"
      - name: Verificar filtros e login contra a API real
        run: |
          api=http://localhost:3000/api

          # Filtros do E8: destaque do período escolhido, variação contra a medição anterior.
          curl --fail --silent --show-error "$api/indicadores/destaques?ano=2024" \
            | grep -q '"nome":"Número de leitos","unidade":"leitos","valor":312,"periodo":{"ano":2024,"semestre":2},"variacao_percentual":11.4}'
          curl --fail --silent --show-error "$api/indicadores?setor=1&ano=2024&semestre=2" | grep -q '"valor":312'
          test "$(curl --silent --show-error "$api/indicadores?ano=2019")" = '[]'
          for consulta in 'ano=abc' 'semestre=3&ano=2024' 'semestre=2' 'setor=abc'; do
            test "$(curl --silent -o /dev/null -w '%{http_code}' "$api/indicadores?$consulta")" = 400
          done

          # Depois do login o front envia Authorization em toda chamada: o preflight precisa liberar.
          curl --fail --silent --show-error -o /dev/null -D - -X OPTIONS \
            -H 'Origin: http://localhost:8080' -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' "$api/indicadores" \
            | grep -qi '^access-control-allow-headers:.*authorization'

          # Login de ponta a ponta com o administrador de desenvolvimento criado pelo seed.
          email=$(docker compose exec -T backend printenv ADMIN_EMAIL)
          senha=$(docker compose exec -T backend printenv ADMIN_SENHA)
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"senha\":\"senha-errada\"}" "$api/auth/login")" = 401
          token=$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"senha\":\"$senha\"}" "$api/auth/login" \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).token)')
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "$api/auth/me" | grep -q "\"email\":\"$email\""
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalido' "$api/auth/me")" = 401
      - name: Comparar o mock do front com a API real
        working-directory: frontend
        run: |
          # Com VITE_USE_MOCK=true o front precisa ver exatamente o que a API devolve.
          node --input-type=module -e '
            import { mockSetores, mockPeriodos, mockIndicadores, mockDestaques } from "./src/mocks/dados.js";
            const api = (rota) => fetch(`http://localhost:3000/api/${rota}`).then((resposta) => resposta.json());
            const pares = { setores: mockSetores, periodos: mockPeriodos, indicadores: mockIndicadores, "indicadores/destaques": mockDestaques };
            let divergiu = false;
            for (const [rota, mock] of Object.entries(pares)) {
              const igual = JSON.stringify(await api(rota)) === JSON.stringify(mock);
              console.log(`${igual ? "igual" : "DIVERGE"}: /api/${rota}`);
              divergiu ||= !igual;
            }
            process.exitCode = divergiu ? 1 : 0;
          '
      - name: Logs e limpeza
        if: always()
        run: |
          docker compose logs || true
          docker compose down --volumes --remove-orphans || true
